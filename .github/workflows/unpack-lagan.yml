name: ZIPni ochib repository'ga joylash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ZIP faylni topish va ochish
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'lagan-qr-mvp*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          cp -a extracted/lagan-qr-mvp/. .
          rm -rf extracted

      - name: Ochilgan fayllarni GitHub'ga saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile render.yaml backend web-menu android-receiver docker-compose.yml README.md .gitignore .github
          git diff --cached --quiet || git commit -m "Unpack Lagan QR source"
          git push
