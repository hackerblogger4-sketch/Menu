name: Extract Lagan ZIP and build

on:
  push:
    paths:
      - 'lagan-qr-mvp-source*.zip'
      - '.github/workflows/extract-lagan.yml'
  workflow_dispatch:

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP faylni ochish
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'lagan-qr-mvp-source*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Backend kutubxonalarini o‘rnatish va tekshirish
        working-directory: extracted/lagan-qr-mvp/backend
        run: |
          npm install
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android debug APK yig‘ish
        working-directory: extracted/lagan-qr-mvp/android-receiver
        run: gradle assembleDebug -PAPI_BASE_URL=https://example.invalid/

      - uses: actions/upload-artifact@v4
        with:
          name: lagan-receiver-debug-apk
          path: extracted/lagan-qr-mvp/android-receiver/app/build/outputs/apk/debug/app-debug.apk
