name: Build APK from Project.zip

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project.zip
        run: |
          set -e
          mkdir -p project
          unzip -q Project.zip -d project

          echo "Project contents:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          if [ -f project/settings.gradle.kts ]; then
            echo "dir=project" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f project/settings.gradle ]; then
            echo "dir=project" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CANDIDATE=$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)

          if [ -z "$CANDIDATE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found inside Project.zip"
            exit 1
          fi

          echo "dir=$(dirname "$CANDIDATE")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRRestaurant-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
