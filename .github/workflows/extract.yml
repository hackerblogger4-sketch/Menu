name: Build APK from Project.zip

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          set -e
          echo "=== Repository ==="
          pwd
          echo ""
          echo "=== Files ==="
          ls -la
          echo ""
          echo "=== Project.zip ==="
          ls -lh Project.zip

      - name: Extract Project.zip
        run: |
          set -e

          rm -rf project
          mkdir -p project

          echo "=== Extracting Project.zip ==="
          unzip -q Project.zip -d project

          echo ""
          echo "=== Extracted files ==="
          find project -maxdepth 5 -type f | sort | head -200

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -e

          echo "=== Searching for Gradle settings ==="

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Project.zip must contain:"
            echo "  settings.gradle.kts"
            echo "  build.gradle.kts"
            echo "  app/"
            echo ""
            echo "=== Full Project.zip structure ==="
            find project -maxdepth 8 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show Android project
        run: |
          set -e

          echo "=== Android project files ==="
          find "${{ steps.locate.outputs.dir }}" -maxdepth 3 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -e

          echo "=== Gradle version ==="
          gradle --version

          echo ""
          echo "=== Building APK ==="
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          set -e

          echo "=== APK files ==="

          find "${{ steps.locate.outputs.dir }}/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRRestaurant-debug-apk
          path: |
            ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
