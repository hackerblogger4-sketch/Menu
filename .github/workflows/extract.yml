name: Build APK from Project.zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project.zip
        run: |
          set -e
          mkdir -p project
          unzip -q Project.zip -d project
          echo "Extracted project:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e
          ROOT="project"
          if [ -f "$ROOT/gradlew" ] && [ -f "$ROOT/settings.gradle.kts" -o -f "$ROOT/settings.gradle" ]; then
            echo "dir=$ROOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CANDIDATE=$(find "$ROOT" -type f -name gradlew -print -quit | xargs -r dirname)
          if [ -z "$CANDIDATE" ]; then
            echo "ERROR: gradlew not found inside Project.zip"
            exit 1
          fi
          echo "dir=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRRestaurant-debug-apk
          path: |
            ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
