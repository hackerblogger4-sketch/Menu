name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "source.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract source.zip
        run: |
          rm -rf project
          mkdir project
          unzip -q source.zip -d project

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find project -type f \( \
            -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
          \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found!"
            echo "source.zip ichida settings.gradle yoki settings.gradle.kts bo'lishi kerak."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lagan-QR-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
