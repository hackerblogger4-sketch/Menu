name: Build Android APK from source.zip

on:
  workflow_dispatch:
  push:
    paths:
      - "source.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract source.zip
        run: |
          rm -rf project
          mkdir project
          unzip -q source.zip -d project

      - name: Find Android Gradle project
        shell: bash
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found inside source.zip"
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5"

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lagan-QR-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
